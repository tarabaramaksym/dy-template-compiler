<div id="dy-recommendations-${dyVariationId}">
    <div class="widget-title">
        <h3 class="title">${Title}</h3>
    </div>
    <div class="dy-recommendations__slider-conatiner">
        <div class="dy-recommendations__slider">
            <div class="dy-recommendations__slider-wrapper">
                ${#Recommendations}
                <div 
                    onclick="window.tpEventToDL('DY Recommendation', ${dyTagId})" class="dy-recommendation-product rec_item_${dyVariationId}"
                    href="${url}"
                    data-dy-sku="${sku}"
                    data-parent-id="${parent-id}"
                    data-sale-driven-usp='${sale_driven_usp_data}'
                    data-quality-icons='${quality_icons_data}'
                    data-is-web-product='${isWebProduct}'
                    data-energy-data='${energy_label_data}'
                    data-is-broken-paint='${is_broken_paint}'
                >
                    <div class="dy-recommendation-product-container">

                        <div class="dy-recommendation-product__image-container">
                            <img class="dy-recommendation-product__image" src="${img_url}" alt="${name}">
                            <div class="sale-driven-usp-elements-wrapper">
                                <!-- Sale driven USP elements will be rendered by JavaScript -->
                            </div>
                        </div>
                        <div class="dy-recommendation-product__details">
                            <div class="dy-recommendation-product__top__wrapper">
                                <div class="brand"><p>${brand}</p></div>
                            </div>
                            <div class="name">
                                <p class="dy-recommendation-product__detail dy-recommendation-product__detail--name">${name}</p>
                            </div>
                            <div class="subtitle">
                                <p class="dy-recommendation-product__detail dy-recommendation-product__detail--subtitle">${subtitle}</p>
                            </div>
    
                            <div class="bottom-wrapper">
                                <div class="prices">
                                    <div class="price-box regular-price">
                                        <div class="dy-recommendation-product__detail dy-recommendation-product__detail--price rec_price_num" data-price="${price}" data-dy-dynamic-price="${dynamic_price}" data-dy-sku="${sku}" data-sales-price="${sales_price}">
                                            <div class="price-left">
                                                <span class="integer"></span>
                                                <span class="decimal"></span>
                                            </div>
                                            <div class="price-right">
                                                <div class="currency-package">
                                                    <span class="rec_price_currency">${Currency Symbol}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="dy-recommendation-product__detail dy-recommendation-product__detail--price price_old rec_price_num" data-price="${price}" data-price-old="1" data-dy-dynamic-price="${dynamic_price}" data-dy-sku="${sku}" data-sales-price="${sales_price}">
                                            <div class="price-left">
                                                <span class="integer"></span>
                                                <span class="decimal"></span>
                                            </div>
                                            <div class="price-right">
                                                <div class="currency-package">
                                                    <span class="rec_price_currency">${Currency Symbol}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="dy-recommendation-product__detail_message"></div>
                                    </div>
                                </div>

                                <div class="online-availability-wrapper">
                                    <!-- Online availability will be rendered by JavaScript if isWebProduct -->
                                </div>

                                <div class="icon-wrapper">
                                    <div class="quality-icons">
                                        <!-- Quality icons will be rendered by JavaScript -->
                                    </div>

                                    <div class="energy-class">
                                        <!-- Energy label will be rendered by JavaScript -->
                                    </div>
                                </div>

                                <div class="broken-paint-marker" style="display: none;">
                                    <span class="marker-label">Välj färg</span>
                                    <span class="marker-icon">

                                </div>
                            </div>
                            <div class="actions">
                                <button onclick="window.tpEventToDL('DY Recommendation', ${dyTagId}, 'a2c')" href="#" class="add-to-cart">Lägg i varukorg</button>
                            </div>
                        </div>
                    </div>
                </div>
                ${/Recommendations}
            </div>
        </div>
        <div class="dy-recommendations-slider-pagination"></div>
        <div class="dy-recommendations-slider-arrows">
            <div class="dy-recommendations-slider-button dy-recommendations-slider-button--prev">
            </div>
            <div class="dy-recommendations-slider-button dy-recommendations-slider-button--next">
            </div>
        </div>
    </div>
    <div class="blur-effect"></div>
</div>
