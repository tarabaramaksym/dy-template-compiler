<div id="dy-recommendations-${dyVariationId}">
    <div class="widget-title">
        <h3 class="title">${Title}</h3>
    </div>
    <div class="dy-recommendations__slider-conatiner">
        <div class="dy-recommendations__slider">
            <div class="dy-recommendations__slider-wrapper">
                ${#Recommendations}
                <div 
                    onclick="window.tpEventToDL('DY Recommendation', '${dyTagId}'); window.location.href = '${url}'"
                    class="dy-recommendation-product rec_item_${dyVariationId}"
                    href="${url}"
                    data-dy-sku="${sku}"
                    data-parent-id="${parent-id}"
                    data-sale-driven-usp='${sale_driven_usp_data}'
                    data-quality-icons='${quality_icons_data}'
                    data-is-web-product='${isWebProduct}'
                    data-energy-data='${energy_label_data}'
                    data-is-broken-paint='${is_broken_paint}'
                    data-swatches-config='${swatches_config}'
                    data-configurable-options='${configurable_options}'
                    data-child-products-mapping='${child_products_mapping}'
                    data-is-single-option='${is_single_option}'
                    data-preblend-rgb='${preblend_rgb}'
                >
                    <form class="dy-recommendation-product-container">

                        <a class="dy-recommendation-product__image-container" href="${url}" tabindex="-1">
                            <img class="dy-recommendation-product__image" src="${img_url}" alt="${name}">
                            <div
                                class="dy-preblend-rgb absolute rounded-full z-10 w-[64px] h-[64px] bottom-[20px] right-[12px] bp-desktop:w-[98px] bp-desktop:h-[98px] bp-desktop:right-[34px] bp-desktop:bottom-[46px]"
                                style="background-color: rgb(${preblend_rgb}); display: none;">
                            </div>
                            <div class="sale-driven-usp-elements-wrapper">
                                <!-- Sale driven USP elements will be rendered by JavaScript -->
                            </div>
                        </a>
                        <div class="dy-recommendation-product__detail_message" style="display: none;">
                            <div class="promotion-wrapper">
                                <span class="clock">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 15 15" fill="none" role="img">
                                        <g clip-path="url(#clip0_11333_5899)">
                                            <path d="M7.50008 13.5001C10.7217 13.5001 13.3334 10.8884 13.3334 7.66677C13.3334 4.44511 10.7217 1.83344 7.50008 1.83344C4.27842 1.83344 1.66675 4.44511 1.66675 7.66677C1.66675 10.8884 4.27842 13.5001 7.50008 13.5001Z" stroke="#EB001E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                            <path d="M7.5 4.16675V7.66675L9.83333 8.83341" stroke="#EB001E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                        </g>
                                        <defs>
                                            <clipPath id="clip0_11333_5899">
                                                <rect width="14" height="14" fill="white" transform="translate(0.5 0.666748)"></rect>
                                            </clipPath>
                                        </defs>
                                        <title>clock-red</title>
                                    </svg>
                                </span>
                                <span class="valid-price-label">
                                    <span class="mobile-text">Aktiv till</span>
                                    <span class="desktop-text">Erbjudandet gäller tom</span>
                                    <strong class="end-date"></strong>
                                </span>
                            </div>
                        </div>
                        <div class="dy-recommendation-product__details">
                            <div class="dy-recommendation-product__top__wrapper">
                                <div class="brand"><p>${brand}</p></div>
                            </div>
                            <div class="name">
                                <a class="dy-recommendation-product__detail dy-recommendation-product__detail--name" href="${url}">${name}</a>
                            </div>
                            <div class="subtitle">
                                <p class="dy-recommendation-product__detail dy-recommendation-product__detail--subtitle">${subtitle}</p>
                            </div>

                            <div class="bottom-wrapper">
                                <div class="prices">
                                    <div class="price-box regular-price">
                                        <div class="dy-recommendation-product__detail dy-recommendation-product__detail--price rec_price_num" data-price="${price}" data-dy-dynamic-price="${dynamic_price}" data-dy-sku="${sku}" data-sales-price="${sales_price}">
                                            <div class="price-left">
                                                <span class="integer"></span>
                                                <span class="decimal"></span>
                                            </div>
                                            <div class="price-right">
                                                <div class="currency-package">
                                                    <span class="rec_price_currency">${Currency Symbol}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="dy-recommendation-product__detail dy-recommendation-product__detail--price price_old rec_price_num" data-price="${price}" data-price-old="1" data-dy-dynamic-price="${dynamic_price}" data-dy-sku="${sku}" data-sales-price="${sales_price}">
                                            <div class="price-left">
                                                <span class="integer"></span>
                                                <span class="decimal"></span>
                                            </div>
                                            <div class="price-right">
                                                <div class="currency-package">
                                                    <span class="rec_price_currency">${Currency Symbol}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="online-availability-wrapper" style="display: none;">
                                    <div class="dy-online-availability">
                                        <span aria-hidden="true" class="dy-availability-icon">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 20 21" fill="none" role="img">
                                                <g clip-path="url(#clip0_11362_5932_37)">

                                                </g>
                                                <defs>
                                                <clipPath id="clip0_11362_5932_37">
                                                <rect width="20" height="20" fill="white" transform="translate(0 0.666748)"></rect>
                                                </clipPath>
                                                </defs>
                                                <title>globe-black</title>
                                            </svg>
                                        </span>
                                        <span class="dy-online-availability-text">Endast online</span>
                                    </div>
                                </div>

                                <div class="dy-swatches-wrapper">
                                <!-- Swatches will be rendered here by JavaScript -->
                                </div>

                                <div class="icon-wrapper">
                                    <div class="quality-icons">
                                        <!-- Quality icons will be rendered by JavaScript -->
                                    </div>

                                    <div class="energy-class">
                                        <!-- Energy label will be rendered by JavaScript -->
                                    </div>
                                </div>

                                <div class="broken-paint-marker" style="display: none;">
                                    <span class="marker-label">Välj färg</span>
                                    <span class="marker-icon" aria-hidden="true">
                                        <img alt="Färg" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABkAAAAYCAYAAAAPtVbGAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAANNSURBVHgBtVZbahRBFD23qvo1GdEoIqhgIgj6F1fgHlyBrkB34CZcgItwAe7AL0EQSfIjqDEQM890d5XnVvf0TCeTh6A11NSzz7nn3lvVLWDZ399/FUJ4ze4W/l35QMyX29vbe7K7u7vjpgcfr398C3v4GbM0wzQrMM0LjNmOiw2MWI+LIY4HWjcwT7JLGR6FB9jxj/dI9NRw/GLw9T3Sg0+wvkZWlcjKE6SsCftJXcHWNWyoYYLndsFVyhfZx0853GJ3R0lumGrSLkkEzcp5rLmStGS29lwN+JsyxlSbLRdHK89SHlWU8Magsg6ZS5CSxFGleI8gV1PSmNzsde1oQdEOArL5HLUYnJBkmuZwqoYktOIq+LB81vRIes81A8P14mSOajaJyZCxbxgbXKLEcN3BIhUXiZYka4Sq2wyDPZxOYjaNihlSxuu8IgouFgkJMhIk7FtvLyJZFo3F9dERJvkgZt262KtjFDiXJCpQAsfW9ZSc8cASSRVplt06+oUfm7d7GaaPpSbBQFISpMiMi65yhipI7E67S+WGU0FdzOn0cDLGncPvkIdP4ppae80UGJocuUmjm9Rdi4AbtkrYIwkNak9I5GznhIP7P75hc8YE2LiLm3bYgSus5T41SrrElT6JOHJntgGU1hGmIRDLDtdR0BWbOZ7f2MJs+BQVk6JEjZq3QA0PzzbEH7pWlS2VpBYySJu8basSR/DcwRRJJInzfhRdpbXovBCgFBWJ9Fe3hCVd5juSxEaQaLWVCC4kBtVJljRzqo7AxvOqCMwyBnpxePVntbaBDtKQjumOk85dqkStJYkk3Jio+1wcr94GgSSBZ0WqEUKyieViwGqKLkhNO26VEFTd4WxHsvZkM9BCG6X6HUl0S5OQF98CbeAJnjckjWvOKTxsoL+l5q3t5whM33VKzti2UKLBXxI06bgEaOYCD56OJcxJNF1lx0XFdP8994SVg9nOx/R2cQ2+ZJZpAlQXgi8wTdOXy61SAmlvIQWnu0Sz7EzpvZyWJDXy9Zt6s3pYTewFzwyjGtRzjv1pazoM76PBe/rUu1HxDKW71ylaq8y4hU3E4HsllFGJaH91tzRnajYV8AW7x6+VDxGBXywvuPgG/+mT6A8lUD/w+q20bwAAAABJRU5ErkJggg=="/>
                                    </span>
                                </div>
                            </div>
                            <div class="actions">
                                <button type="submit" onclick="window.tpEventToDL('DY Recommendation', '${dyTagId}', 'a2c'); event.stopPropagation();" href="#" class="add-to-cart">Lägg i varukorg</button>
                            </div>
                        </div>
                    </form>
                </div>
                ${/Recommendations}
            </div>
        </div>
        <div class="dy-recommendations-slider-pagination"></div>
        <div class="dy-recommendations-slider-arrows">
            <div class="dy-recommendations-slider-button dy-recommendations-slider-button--prev">
            </div>
            <div class="dy-recommendations-slider-button dy-recommendations-slider-button--next">
            </div>
        </div>
    </div>
    <div class="blur-effect"></div>
</div>
